name: Deploy CMS
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'definitions/**/*'
      - 'client/projects/cms/**/*'
      - '.github/workflows/cms.workflow.yml'
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      project: 'jp-bioinspekt'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v2
      - name: Use Node.js 17.1.0
        uses: actions/setup-node@v1
        with:
          node-version: 17.1.0
      - name: Prepare definitions package
        run: |
          npm --prefix definitions ci
          npm --prefix definitions run build
      - name: Install Dependencies
        run: |
          npm --prefix client ci
      - name: Build
        run: npm run build:cms
      - name: Use Node.js 22 for the Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        run: npx firebase-tools@15.31.0 deploy --only hosting:cms --project ${{ env.project }} --non-interactive
