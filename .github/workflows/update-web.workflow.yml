name: Update Web
on:
  workflow_dispatch:
    inputs:
      description:
        description: 'Release description'
jobs:
  deploy:
    env:
      project: 'jp-bioinspekt'
      # Build Branch
      # Deploy Web pushes the prebuilt web/node_modules here, which is why
      # this workflow can skip `npm ci`. We always build from this branch,
      # whatever ref the dispatch came in on.
      build: 'build'
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@master
        with:
          ref: ${{ env.build }}
      - name: Write Service Account Key
        run: |
          cd web
          echo $SERVICE_ACCOUNT > key.json
        env:
          SERVICE_ACCOUNT: ${{ secrets.SERVICE_ACCOUNT }}
      - name: Build
        run: npm run build:web
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy to Firebase
        run: npx firebase-tools@15.31.0 deploy --only hosting:web --project ${{ env.project }} --non-interactive
      - name: Update Firestore
        run: |
          cd web
          node update-release.js
